# This workflow is responsible for publishing  packages to PyPi
# and creating offline packages

name: "Release New Version"

on:
  - workflow_call
  - workflow_dispatch

jobs:
  publish:
    name: Publish to PyPi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Update PIP tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install wheel twine

      - name: Build
        run: python setup.py sdist bdist_wheel

      - name: Publish to PyPi
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload dist/*

      - name: Build off-line installer
        id: build
        shell: bash
        run: |
          output=$(python offline_installer/build.py)
          echo "file_name=$output" >> "$GITHUB_OUTPUT"

      # This workflow is dispatched from a branch (master), so github.ref_name is the branch name.
      # Tag the release with the package version instead (matches existing tags, e.g. 10.19.2).
      - name: Get package version
        id: version
        shell: bash
        run: |
          version="$(python setup.py --version | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Replaces actions/create-release@v1 + actions/upload-release-asset@v1 (node12, archived).
      - name: Create release and upload off-line installer
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: ./dist/${{ steps.build.outputs.file_name }}
